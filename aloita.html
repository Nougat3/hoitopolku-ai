<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aloita hoitopolku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,-apple-system,sans-serif;background:#fff;color:#1D1D1F;text-align:center;padding:32px}
.box{max-width:28em}
.eyebrow{color:#A67C2E;font-weight:600;margin:0 0 12px}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;line-height:1.1;margin:0 0 16px}
p{color:#6E6E73;font-size:18px;line-height:1.5}
a{color:#A67C2E}
</style>
</head>
<body>
<div class="box">
<p class="eyebrow">Hoitopolku</p>
<h1>Hoitopolku alkaa kutsusta omalta lääkäriltä</h1>
<p>Ei avointa ilmoittautumista. Jos sinulla on kutsu, avaa se lääkärisi lähettämästä linkistä.</p>
<p><a href="index.html">Takaisin sivulle</a></p>
</div>
<script>
var q=new URLSearchParams(location.search).get("kutsu");
if(q){
  document.querySelector("h1").textContent="Kutsu vastaanotettu";
  document.querySelectorAll("p")[1].textContent="Alusta avataan tähän kutsuun, kun julkaisu on valmis. Pidä tämä linkki tallessa.";
}
</script>
</body>
</html>
